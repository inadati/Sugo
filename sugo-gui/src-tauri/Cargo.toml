[package]
name = "sugo-gui"
version = "0.13.5"
edition = "2024"

[lib]
name = "sugo_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sugo-core = { path = "../../sugo-core" }
sugo-infra = { path = "../../sugo-infra" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
sugo-core = { path = "../../sugo-core", features = ["test-support"] }
tokio = { workspace = true }
